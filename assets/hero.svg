<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Notepad Viewer Plus — Your files. In full view.</title>
  <desc id="desc">A conceptual illustration of an offline docked preview for Markdown, diagrams, structured data, and PDF documents inside Notepad++.</desc>
  <defs>
    <linearGradient id="heroBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D172A"/>
      <stop offset="0.56" stop-color="#15233B"/>
      <stop offset="1" stop-color="#202D49"/>
    </linearGradient>
    <linearGradient id="windowSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#F5EEE3"/>
    </linearGradient>
    <linearGradient id="coralWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF765E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F4A477" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#A7B8D2" stroke-opacity="0.12"/>
    </pattern>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#050A14" flood-opacity="0.34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102039" flood-opacity="0.12"/>
    </filter>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; }
      .ink { fill: #17243B; }
      .muted { fill: #647087; }
      .light { fill: #FFF9F0; }
      .line { stroke: #D9D5CD; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="url(#heroBackground)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <circle cx="1450" cy="-30" r="310" fill="#EF765E" opacity="0.12"/>
  <circle cx="610" cy="690" r="290" fill="#7BC8B7" opacity="0.08"/>
  <path d="M0 560C260 500 405 610 662 562C839 530 1017 432 1236 482C1390 517 1492 575 1600 552V640H0Z" fill="#0A1325" opacity="0.42"/>

  <g class="ui">
    <g transform="translate(96 60)">
      <rect width="42" height="42" rx="13" fill="#EF765E"/>
      <path d="M10 26h22M21 15v22" stroke="#FFF9F0" stroke-width="4" stroke-linecap="round"/>
      <circle cx="13" cy="13" r="3" fill="#FFF9F0"/>
      <text x="58" y="28" fill="#FFF9F0" font-size="22" font-weight="700" letter-spacing="0.2">Notepad Viewer Plus</text>
    </g>

    <text x="98" y="166" fill="#F6B49A" font-size="16" font-weight="700" letter-spacing="2.6">A CLEARER WAY TO READ YOUR FILES</text>
    <text x="96" y="240" fill="#FFF9F0" font-size="70" font-weight="700" letter-spacing="-2.4">Your files.</text>
    <text x="96" y="316" fill="#FFF9F0" font-size="70" font-weight="700" letter-spacing="-2.4">In full view.</text>
    <text x="100" y="370" fill="#C9D2E0" font-size="23">Offline previews inside Notepad++</text>
    <text x="100" y="405" fill="#92A1B8" font-size="17">Open a document. Keep your focus. See the structure.</text>

    <g transform="translate(98 456)">
      <rect width="196" height="40" rx="20" fill="#EF765E"/>
      <text x="22" y="26" fill="#FFF9F0" font-size="15" font-weight="700">Markdown · Diagrams</text>
      <rect x="208" width="130" height="40" rx="20" fill="#263752" stroke="#6A7891" stroke-opacity="0.65"/>
      <text x="230" y="26" fill="#DCE4EF" font-size="15" font-weight="600">Data · PDF</text>
    </g>
    <text x="100" y="552" fill="#9EACC0" font-size="15" letter-spacing="0.5">Windows  ·  Local rendering  ·  Docked preview</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="752" y="66" width="754" height="508" rx="30" fill="url(#windowSurface)"/>
    <rect x="752" y="66" width="754" height="64" rx="30" fill="#E9E5DE"/>
    <rect x="752" y="100" width="754" height="30" fill="#E9E5DE"/>
    <circle cx="788" cy="98" r="7" fill="#EF765E"/>
    <circle cx="812" cy="98" r="7" fill="#E2B557"/>
    <circle cx="836" cy="98" r="7" fill="#75B6A6"/>
    <text x="882" y="104" class="ui muted" font-size="15" font-weight="600">Notepad Viewer Plus</text>
    <text x="1480" y="104" text-anchor="end" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.3">CONCEPT PREVIEW</text>

    <rect x="784" y="154" width="154" height="386" rx="18" fill="#EDE9E2"/>
    <text x="812" y="190" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.5">VIEWERS</text>
    <rect x="802" y="210" width="118" height="38" rx="10" fill="#FFF9F0"/>
    <rect x="802" y="210" width="5" height="38" rx="2.5" fill="#EF765E"/>
    <text x="820" y="234" class="ui ink" font-size="14" font-weight="700">Overview</text>
    <text x="820" y="278" class="ui muted" font-size="14">Markdown</text>
    <text x="820" y="312" class="ui muted" font-size="14">Diagrams</text>
    <text x="820" y="346" class="ui muted" font-size="14">Structured data</text>
    <text x="820" y="380" class="ui muted" font-size="14">PDF</text>
    <path d="M812 420H910" class="line"/>
    <circle cx="818" cy="452" r="6" fill="#75B6A6"/>
    <text x="834" y="457" class="ui muted" font-size="12">Local mode</text>

    <text x="974" y="190" class="ui ink" font-size="25" font-weight="700">A calm view of the work</text>
    <text x="974" y="218" class="ui muted" font-size="14">A small, focused canvas beside your editor.</text>

    <g filter="url(#softShadow)">
      <rect x="974" y="248" width="236" height="126" rx="16" fill="#FFFDF9"/>
      <rect x="974" y="248" width="7" height="126" rx="3.5" fill="#EF765E"/>
      <text x="996" y="276" class="ui ink" font-size="15" font-weight="700">MARKDOWN</text>
      <text x="996" y="302" class="ui ink" font-size="17" font-weight="700">Launch brief</text>
      <path d="M996 321H1162M996 337H1142M996 353H1118" stroke="#B4BBC3" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1169" cy="338" r="12" fill="#F6E3DA"/>
      <path d="M1164 338l4 4 7-9" fill="none" stroke="#EF765E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="1232" y="248" width="236" height="126" rx="16" fill="#FFFDF9"/>
      <rect x="1232" y="248" width="7" height="126" rx="3.5" fill="#75B6A6"/>
      <text x="1254" y="276" class="ui ink" font-size="15" font-weight="700">DIAGRAMS</text>
      <path d="M1272 330L1317 299L1375 327L1428 291" fill="none" stroke="#75B6A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1272" cy="330" r="13" fill="#DDF0EA" stroke="#75B6A6" stroke-width="2"/>
      <circle cx="1317" cy="299" r="13" fill="#DDF0EA" stroke="#75B6A6" stroke-width="2"/>
      <circle cx="1375" cy="327" r="13" fill="#DDF0EA" stroke="#75B6A6" stroke-width="2"/>
      <circle cx="1428" cy="291" r="13" fill="#DDF0EA" stroke="#75B6A6" stroke-width="2"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="974" y="396" width="236" height="126" rx="16" fill="#FFFDF9"/>
      <rect x="974" y="396" width="7" height="126" rx="3.5" fill="#D6A84E"/>
      <text x="996" y="424" class="ui ink" font-size="15" font-weight="700">STRUCTURED DATA</text>
      <path d="M996 445H1185M996 464H1185M996 483H1185M1057 438V494M1127 438V494" stroke="#D6D1C8" stroke-width="2"/>
      <rect x="1000" y="441" width="49" height="8" rx="4" fill="#F3DEAA"/>
      <rect x="1063" y="441" width="58" height="8" rx="4" fill="#DDECE7"/>
      <rect x="1133" y="441" width="38" height="8" rx="4" fill="#F5D5CA"/>
    </g>

    <g filter="url(#softShadow)">
      <rect x="1232" y="396" width="236" height="126" rx="16" fill="#FFFDF9"/>
      <rect x="1232" y="396" width="7" height="126" rx="3.5" fill="#879BC1"/>
      <text x="1254" y="424" class="ui ink" font-size="15" font-weight="700">PDF</text>
      <rect x="1254" y="440" width="72" height="61" rx="7" fill="#F0F3F8" stroke="#D0D8E5"/>
      <path d="M1266 455H1313M1266 466H1313M1266 477H1298" stroke="#879BC1" stroke-width="4" stroke-linecap="round"/>
      <text x="1342" y="462" class="ui ink" font-size="14" font-weight="700">Read in place</text>
      <text x="1342" y="484" class="ui muted" font-size="12">Keep it nearby.</text>
    </g>
  </g>
</svg>
